name: ViewDock
options:
  bundleIdPrefix: dev.viewdock
  deploymentTarget:
    iOS: "17.0"

packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    from: 137.0.0

targets:
  ViewDock:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # XcodeGen has no `resources:` key for targets (it was silently ignored, so
      # the app icon never made it into the app); asset catalogs go in `sources`.
      - path: Resources/Assets.xcassets
      # The About screen's license texts, generated by scripts/generate_legal.py. A folder
      # reference keeps them under Legal/ in the bundle (AppInfo.legalSubdirectory).
      - path: Resources/Legal
        type: folder
    dependencies:
      - package: WebRTC
    info:
      path: Resources/Info.plist
      properties:
        # XcodeGen otherwise writes a hard-coded 1.0 here, ignoring MARKETING_VERSION below.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: >
          view-dock discovers and connects to the view-dock host on your
          local network to use your iPad as a second display.
        NSBonjourServices:
          - _viewdock._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.viewdock.ipad
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "2" # iPad only
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon # Resources/Assets.xcassets, generated from branding/icon.svg
        DEVELOPMENT_TEAM: #your team id here
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "2.0.2" # tracks the repo release (see CHANGELOG.md)
        CURRENT_PROJECT_VERSION: "1" # build number; only needs to increase if you ever upload to App Store Connect
