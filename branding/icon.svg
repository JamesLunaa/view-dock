<?xml version="1.0" encoding="UTF-8"?>
<!--
  Master view-dock app icon: the host display (white) and the extended display
  that overlaps it (blue), on a navy field. This is the one source of truth;
  `python branding/generate_icons.py` derives the host, iPad and Android icons
  from it. The geometry is the Android adaptive icon's (108x108 viewport, with
  the artwork inside the 66x66 safe zone). Edit the three elements below by id.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="1024" height="1024">
  <rect id="background" width="108" height="108" fill="#1B2A49"/>
  <path id="screen-back" fill="#FFFFFF"
        d="M30,36h34a3,3 0 0 1 3,3v22a3,3 0 0 1 -3,3H30a3,3 0 0 1 -3,-3V39a3,3 0 0 1 3,-3z"/>
  <path id="screen-front" fill="#7FB2FF"
        d="M52,50h26a3,3 0 0 1 3,3v18a3,3 0 0 1 -3,3H52a3,3 0 0 1 -3,-3V53a3,3 0 0 1 3,-3z"/>
</svg>
