name: codeql

# DISABLED while the repository is private: code scanning on a private repo needs
# GitHub's paid code-security add-on, so automatic runs would just fail. It still
# runs by hand ("Run workflow") if that add-on is ever available. To turn the
# automatic runs back on (e.g. if the repo goes public again), replace the
# `workflow_dispatch:` line below with the original triggers:
#
#   push:
#     branches: [master, dev]
#   pull_request:
#   schedule:
#     # Weekly, so newly published queries find old code too.
#     - cron: "17 4 * * 1"
on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: analyze (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v3

# The iPad app isn't analyzed here: CodeQL's Swift support needs a macOS
# runner and a full Xcode build, which this repo's CI doesn't do.
