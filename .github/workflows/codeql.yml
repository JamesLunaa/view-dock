name: codeql

on:
  push:
    branches: [master, dev]
  pull_request:
  schedule:
    # Weekly, so newly published queries find old code too.
    - cron: "17 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: analyze (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v3

# The iPad app isn't analyzed here: CodeQL's Swift support needs a macOS
# runner and a full Xcode build, which this repo's CI doesn't do.
