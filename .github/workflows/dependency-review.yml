name: dependency-review

# Flags dependencies added in a pull request that have known vulnerabilities
# or a license problem, before they're merged.
on: pull_request

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
