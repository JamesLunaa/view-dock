name: tests

on:
  push:
    branches: [master, dev]
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        # The lock file is the exact, hash-verified dependency set (see its
        # header). It deliberately excludes PySide6, which only the optional
        # host GUI needs and which the test suite never imports.
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r host/requirements.lock.txt

      - name: Run host test suite
        run: python -m pytest host/tests -v
