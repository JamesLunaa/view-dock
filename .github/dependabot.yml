version: 2
updates:
  # Host Python dependencies: host/requirements.txt (floating ranges) and
  # host/requirements.lock.txt (exact, hash-pinned — see its header).
  - package-ecosystem: "pip"
    directory: "/host"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # aiortc 1.15.0 requires av<18, so av 18 can't be installed with it.
      # Drop this once an aiortc release allows av 18, then bump both together.
      - dependency-name: "av"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"

  # Action versions used by the workflows in .github/workflows/.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"

# Not covered here: the iPad app's WebRTC dependency. It is declared in
# ipad/project.yml for XcodeGen, not in a Package.swift, so Dependabot's
# Swift support can't see it — check it by hand when bumping the iOS side.
