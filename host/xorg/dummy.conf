# xf86-video-dummy config for view-dock's virtual display, run as a SEPARATE
# X server (display :1) alongside your normal desktop session — not as a
# replacement for it. See host/scripts/start-dummy-display.sh and
# host/README.md's "Testing without xf86-video-dummy on your real session"
# section for how this fits together and its known limitations.
#
# Requires: xorg-server, xf86-video-dummy (pacman -S xorg-server xf86-video-dummy)

Section "Device"
    Identifier "DummyDevice"
    Driver "dummy"
    # NOTE: the "VideoRam" option is silently ignored by at least
    # xf86-video-dummy 0.4.1 (confirmed via `strings dummy_drv.so` — no
    # VideoRam option string present in that build at all), which hardcodes
    # a 4096 KB framebuffer. That caps the usable virtual size to roughly
    # 1024x768 at 32bpp (~1.05M pixels) SHARED across every enabled DUMMY*
    # output on this X server — keep only one DUMMY output enabled at a
    # time, and use VIEWDOCK_DISPLAY_WIDTH/HEIGHT (host/config.py) to size
    # the requested mode accordingly if you hit "exceeds video memory".
    Option "VideoRam" "256000"
EndSection

Section "Monitor"
    Identifier "DummyMonitor"
    HorizSync 5.0 - 1000.0
    VertRefresh 5.0 - 200.0
EndSection

Section "Screen"
    Identifier "DummyScreen"
    Device "DummyDevice"
    Monitor "DummyMonitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Virtual 1024 768
    EndSubSection
EndSection

Section "ServerLayout"
    Identifier "DummyLayout"
    Screen "DummyScreen"
EndSection
